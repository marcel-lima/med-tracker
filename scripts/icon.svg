    <g transform="rotate(120 256 256) translate(256 82)"><rect x="-19" y="-44" width="38" height="88" rx="19" fill="#34C38F"/><path d="M-19 0 L-19 -25 A19 19 0 0 1 19 -25 L19 0 Z" fill="#249C70"/><rect x="-12" y="-34" width="5" height="68" rx="2.5" fill="rgba(255,255,255,.35)"/></g>
    <g transform="rotate(150 256 256) translate(256 82)"><rect x="-19" y="-44" width="38" height="88" rx="19" fill="#8A6CF6"/><path d="M-19 0 L-19 -25 A19 19 0 0 1 19 -25 L19 0 Z" fill="#6A4BD6"/><rect x="-12" y="-34" width="5" height="68" rx="2.5" fill="rgba(255,255,255,.35)"/></g>
    <g transform="rotate(180 256 256) translate(256 82)"><rect x="-19" y="-44" width="38" height="88" rx="19" fill="#F0655A"/><path d="M-19 0 L-19 -25 A19 19 0 0 1 19 -25 L19 0 Z" fill="#D14A40"/><rect x="-12" y="-34" width="5" height="68" rx="2.5" fill="rgba(255,255,255,.35)"/></g>
