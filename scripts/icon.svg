<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: 12 two-tone capsules around a clock face, hands at 8:00 (a typical dose time) -->
  <rect width="512" height="512" fill="#F2F3F7"/>
  <g id="ring">
    <!-- colors cycle through the app palette -->
