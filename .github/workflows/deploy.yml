# Publica na Vercel a cada push na main, sem depender da integração GitHub↔Vercel.
# Segredo necessário (repositório → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN   vercel.com → Account Settings → Tokens → Create
# O projeto é localizado pelo nome, dentro do time abaixo.
name: Deploy na Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_SCOPE: marcel-limas-projects
      VERCEL_PROJECT: med-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Vincular ao projeto na Vercel
        run: vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Baixar configuração do projeto
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
